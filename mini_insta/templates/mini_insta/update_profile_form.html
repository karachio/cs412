<!-- blog/update_article_form.html 
    display the HTML form to update an Article object.
-->
{% extends 'mini_insta/base.html' %}
 
 
{% block content %}
<h2>Update this Profile</h2>
 
 
<form action="{% url 'update_profile' profile.pk %}" method="POST"
    enctype="multipart/form-data">
    {% csrf_token %}
    <table>

        {{form.as_table}}
    </table>

    <input type="submit" name="submit" value="Update">

</form>

<form action="{% url 'show_profile' profile.pk %}" method="GET">
    <input type="submit" value="Cancel">
</form>

{% endblock %}
