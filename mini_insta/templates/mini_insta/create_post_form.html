{% extends 'mini_insta/base.html' %}
 
 
{% block content %}
<h2>Create a new Post</h2>
 
 
<form method = 'POST' enctype="multipart/form-data">
    {% csrf_token %}
    <table>
    {{form.as_table}}
    </table>
 
 
    <input type="submit" name="submit" value="Submit">

    <a href="{% url 'show_profile' profiles.pk %}">Cancel</a>
</form>
{% endblock %}
