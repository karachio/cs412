{% extends 'mini_insta/base.html' %}
 
{% block content %}
<!-- templates/mini_insta/delete_post_form.html -->
 
<h3>Are you sure you want to delete this post?</h3>
 
<p>
{{post}}
</p>
 
 <!--to confirm deletion-->
<form method='POST'>
    {% csrf_token %}
    <input type='submit' value="Delete">
</form>

 <!--to cancel deletion-->
<form action="{% url 'show_profile' post.profile.pk %}" method='GET' >
    <input type='submit' value="Cancel">
</form>
{% endblock %}
