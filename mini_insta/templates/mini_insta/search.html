{% extends 'mini_insta/base.html' %}

{% block content %}

<div class="search-page">

    <h1>Search</h1>

    <div class="search-container">

        <form method="GET" action="{% url 'search' profile.pk %}">

            <label for="query">Search:</label>
            
            <textarea name="q" id="query" rows="2" cols="40"
                placeholder="Search profiles or posts"></textarea>

            <br><br>

            <button type="submit">Search</button>

        </form>

    </div>

</div>

{% endblock %}
