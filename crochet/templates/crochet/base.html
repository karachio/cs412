{% load static %}

<html>
<head>
    <title>{% block title %}Crochet Projects{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'styles-for-crochet.css' %}">
</head>

<body>

<nav>
    <a class="brand" href="{% url 'project-list' %}">🧶 crochet</a>

    <a href="{% url 'project-list' %}">All Projects</a>
    {% if user.is_authenticated %}
        <a href="{% url 'create-project' %}">+ New Project</a>
    {% endif %}
    <a href="{% url 'yarn-search' %}">Yarn Search</a>
    <a href="{% url 'project-search' %}">Explore</a>
</nav>

<div class="page">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
